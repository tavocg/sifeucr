openapi: 3.1.0
info:
  title: sifeucr API
  version: 0.1.0
  description: >-
    OpenAPI specification of sifeucr. JSON request bodies are limited to 1 MiB;
    oversized bodies return 400. JSON responses include Cache-Control no-store.
    Unmatched routes return a localized HTML page or JSON with status 404,
    negotiated using Accept with the same weights and defaults as the root.
    If neither format is acceptable, router 404 responses fall back to JSON;
    both formats use no-store and Vary on Accept and Accept-Language.
    Unsupported methods
    return localized JSON with status 405 and the Allow header. The root page
    matches only the application root, not unknown paths.
    The root page negotiates application/json or text/html using Accept weights,
    wildcards and media parameters. JSON wins equal weights and is the fallback
    when Accept is absent, blank, unsupported or excludes both formats. Unsupported
    preferences do not produce status 406. Both formats use no-store
    and Vary on Accept and Accept-Language; XHTML is not offered. API endpoints
    remain JSON-only.
    JSON request bodies are parsed regardless of Content-Type; missing headers
    and text/plain are accepted, but the body must still contain valid JSON.
    Registered routes carry a twenty-second request-context deadline. Database
    operations and mail delivery use that context; failures after it expires
    return localized JSON with status 504 if response headers have not been sent.
    Cancellation is cooperative and does
    not roll back changes already committed before the deadline.
    Login verifies institutional credentials through SMTP over verified TLS.
    Development mode skips credential verification. Passwords are never stored.
    Login attempts are limited to five per ten minutes per normalized email.
    Per-client-IP throttling belongs in the deployment reverse proxy.
    Application routes provide automatic OPTIONS responses with Allow. CORS is
    disabled by default and configured by an origin allowlist, optionally
    overridden per endpoint. Preflights validate the requested method and allow
    Authorization, Content-Type, Accept and Accept-Language headers. Rejected
    preflights return 403. Browser credentials are not enabled.
servers:
  - url: https://example.com
    description: Production server
  - url: http://localhost:3080
    description: Local development server
tags:
  - name: Authentication
  - name: Account
  - name: Suppliers
  - name: Panel
  - name: Information
paths:
  /suppliers:
    get:
      tags: [Suppliers]
      operationId: listSuppliers
      summary: List suppliers
      description: Available to all authenticated accounts.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Suppliers with their associated budgets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
        '401':
          description: A valid bearer token is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database or authentication service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    post:
      tags: [Suppliers]
      operationId: createSupplier
      summary: Create a supplier linked to an existing budget
      description: Requires the perm.admin permission.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequest'
      responses:
        '201':
          description: Record created. The response body is empty.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: A valid bearer token is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account lacks the admin permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database or authentication service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /suppliers/{id}:
    put:
      tags: [Suppliers]
      operationId: updateSupplier
      summary: Replace the details of an existing supplier
      description: Requires the perm.admin permission.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequest'
      responses:
        '204':
          description: Record updated. The response body is empty.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: A valid bearer token is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account lacks the admin permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database or authentication service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /budgets:
    get:
      tags: [Panel]
      operationId: listBudgets
      summary: List budgets
      description: Requires the perm.admin permission.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Budgets visible to the administrator.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
        '401':
          description: A valid bearer token is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account lacks the admin permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database or authentication service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    post:
      tags: [Panel]
      operationId: createBudget
      summary: Create a budget
      description: Requires the perm.admin permission.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetRequest'
      responses:
        '201':
          description: Record created. The response body is empty.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: A valid bearer token is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account lacks the admin permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database or authentication service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /purchase-processes:
    get:
      tags: [Panel]
      operationId: listPurchaseProcesses
      summary: List purchase processes
      description: Requires the perm.admin permission.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Purchase processes visible to the administrator.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseProcess'
        '401':
          description: A valid bearer token is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account lacks the admin permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database or authentication service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    post:
      tags: [Panel]
      operationId: createPurchaseProcess
      summary: Create a purchase process
      description: Requires the perm.admin permission. The process must start on or after the budget start and end on or before the budget end. An interval outside these bounds returns 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseProcessRequest'
      responses:
        '201':
          description: Record created. The response body is empty.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: A valid bearer token is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account lacks the admin permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database or authentication service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /livez:
    get:
      operationId: liveness
      summary: Process liveness
      description: Operational route at the absolute path /livez, independent of the configured application root. Does not check SQL. Responses have no body and use Cache-Control no-store.
      responses:
        '204':
          description: HTTP server is responsive.
  /readyz:
    get:
      operationId: readiness
      summary: Readiness to accept traffic
      description: Operational route at the absolute path /readyz, independent of the configured application root. Checks SQL with a one-second timeout and rejects traffic eligibility during shutdown. Does not expose dependency details. Responses have no body and use Cache-Control no-store.
      responses:
        '204':
          description: Instance is ready.
        '503':
          description: SQL unavailable or instance draining.
  /about:
    get:
      tags:
        - Information
      operationId: aboutPage
      summary: About the institutional platform
      description: Public localized HTML page. Uses Cache-Control no-store and Vary Accept-Language. The configured root prefix applies.
      responses:
        '200':
          description: Platform information.
          content:
            text/html:
              schema:
                type: string
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /terms:
    get:
      tags:
        - Information
      operationId: termsPage
      summary: Terms and privacy
      description: Public localized HTML describing institutional use, credentials, account and session data, and authentication cookies. Uses Cache-Control no-store and Vary Accept-Language. The configured root prefix applies.
      responses:
        '200':
          description: Terms and privacy page.
          content:
            text/html:
              schema:
                type: string
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /s/LICENSE.txt:
    get:
      tags:
        - Information
      operationId: applicationLicense
      summary: Application license
      description: Static copy of the repository LICENSE, embedded during template generation. The configured root prefix applies.
      responses:
        '200':
          description: GNU GPL version 3 license text.
          content:
            text/plain:
              schema:
                type: string
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /auth/login:
    post:
      tags:
        - Authentication
      operationId: loginOrCreateAccount
      summary: Sign in with institutional credentials
      description: Validates email and password against the configured institutional SMTP server with verified TLS. Development skips verification and allows an omitted password. Creates the local account if missing and returns session tokens. Limited to five attempts per ten minutes per normalized email. Passwords are never stored or logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated account and created session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: Credentials rejected by the institutional server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Institutional authentication unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        default:
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      tags:
        - Authentication
      operationId: refreshSession
      summary: Refresh session tokens
      description: Atomically consumes a refresh token and issues a replacement for the same account session generation. Tokens from a revoked generation or expired while waiting for a database lock are rejected. Account-wide revocation invalidates both access and refresh tokens; requests already authenticated may finish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: X4fFxvY89ypw5f...
      responses:
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '200':
          description: Refreshed tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
              example:
                access_token: eyJhbGciOiJIU...
                refresh_token: X4fFxvY89ypw5f...
                expires_in: 900
                refresh_token_expires_in: 2592000
        default:
          $ref: '#/components/responses/Error'
  /account:
    get:
      tags:
        - Account
      operationId: getAccount
      summary: Get account details
      security:
        - bearerAuth: []
      responses:
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '200':
          description: Account information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                email: john@doe.com
                created_at: 1777872664
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Account
      operationId: deleteAccount
      summary: Delete account
      description: Deletes the authenticated account. Subsequent requests with its access tokens are rejected and its refresh tokens are removed.
      security:
        - bearerAuth: []
      responses:
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '204':
          description: Account deleted.
        default:
          $ref: '#/components/responses/Error'
  /account/sessions:
    get:
      tags:
        - Account
      operationId: listSessions
      summary: List open account sessions
      description: Returns up to 100 sessions, newest first, scoped to the authenticated account. Follow next_cursor to obtain subsequent pages. Device information is the unverified User-Agent captured at login; last_used_at records issuance or refresh, not every API request. The current field identifies the caller's session. Credentials and credential hashes are never returned. Responses are not cached.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: Opaque next_cursor from the preceding page. Omit for the first page.
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Open account sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSessions'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Account
      operationId: revokeSessions
      summary: Close all account sessions
      description: Requires no body. Atomically rotates the account generation and removes all its sessions, including the caller's. Existing access and refresh tokens are rejected on subsequent requests; already authenticated requests may finish. The account remains intact, and a fresh login can create a new session. The empty response includes Cache-Control no-store.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All account sessions revoked.
        '401':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        default:
          $ref: '#/components/responses/Error'
  /account/sessions/{id}:
    delete:
      tags:
        - Account
      operationId: revokeSession
      summary: Close one account session
      description: Requires no body. Revokes the selected session's access and refresh tokens while preserving other sessions. Only sessions owned by the authenticated account can be revoked. Deleting an absent session or an identifier belonging to another account returns the same 204. Revoking the caller's session makes its subsequent requests unauthorized. Already authenticated requests may finish. The empty response includes Cache-Control no-store.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Session identifier from the session list.
          schema:
            type: string
            minLength: 64
            maxLength: 64
            pattern: '^[0-9a-f]{64}$'
      responses:
        '204':
          description: Session revoked or no matching session owned by this account.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access tokens must contain an expiration, a session identifier (sid), and the current account authentication identity. Every verification reads the live session without caching; deleting one session invalidates its access tokens as well as its refresh token. Account-wide session revocation rotates this identity, rejecting previous tokens immediately on subsequent verification. Tokens for deleted accounts and tokens issued before the account identity migration are rejected.
  responses:
    RequestTimeout:
      description: The request-context deadline expired. Changes committed before expiration may still have taken effect.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LoginRateLimited:
      description: Five login attempts per ten minutes per normalized email. Limits persist across restarts.
      headers:
        Retry-After:
          description: Seconds until this request budget resets.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SupplierRequest:
      type: object
      additionalProperties: false
      required: [identity_number, name, description, email, phone, iban, budget_id]
      properties:
        identity_number: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, minLength: 1, maxLength: 4000}
        email: {type: string, format: email, maxLength: 254}
        phone: {type: string, minLength: 1, maxLength: 64}
        iban: {type: string, minLength: 1, maxLength: 64}
        budget_id: {type: integer, format: int64, minimum: 1}
    Supplier:
      type: object
      additionalProperties: false
      required: [identity_number, name, description, email, phone, iban, budget_id, id, budget_name]
      properties:
        identity_number: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, minLength: 1, maxLength: 4000}
        email: {type: string, format: email, maxLength: 254}
        phone: {type: string, minLength: 1, maxLength: 64}
        iban: {type: string, minLength: 1, maxLength: 64}
        budget_id: {type: integer, format: int64, minimum: 1}
        id: {type: integer, format: int64}
        budget_name: {type: string}
    BudgetRequest:
      type: object
      additionalProperties: false
      required: [name, item_number, amount, starts_at, ends_at]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        item_number: {type: string, pattern: '^[0-9]+$', example: '001', description: Numeric item code. Leading zeros are significant.}
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          description: Nonnegative decimal amount up to 92233720368547758.07. Responses use exactly two decimal places.
          example: '1234.50'
        starts_at: {type: string, format: date-time, description: Inclusive start with whole-second precision.}
        ends_at: {type: string, format: date-time, description: Exclusive end after the start with whole-second precision.}
    Budget:
      type: object
      additionalProperties: false
      required: [name, item_number, amount, starts_at, ends_at, id]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        item_number: {type: string, pattern: '^[0-9]+$', example: '001', description: Numeric item code. Leading zeros are significant.}
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          description: Nonnegative decimal amount up to 92233720368547758.07. Responses use exactly two decimal places.
          example: '1234.50'
        starts_at: {type: string, format: date-time, description: Inclusive start with whole-second precision.}
        ends_at: {type: string, format: date-time, description: Exclusive end after the start with whole-second precision.}
        id: {type: integer, format: int64}
    PurchaseProcessRequest:
      type: object
      additionalProperties: false
      required: [name, starts_at, ends_at, budget_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        starts_at: {type: string, format: date-time, description: Inclusive process start with whole-second precision.}
        ends_at: {type: string, format: date-time, description: Exclusive process end after its start with whole-second precision.}
        budget_id: {type: integer, format: int64, minimum: 1, description: ID of an existing budget.}
    PurchaseProcess:
      type: object
      additionalProperties: false
      required: [name, starts_at, ends_at, budget_id, id, budget_name]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        starts_at: {type: string, format: date-time, description: Inclusive process start with whole-second precision.}
        ends_at: {type: string, format: date-time, description: Exclusive process end after its start with whole-second precision.}
        budget_id: {type: integer, format: int64, minimum: 1, description: ID of an existing budget.}
        id: {type: integer, format: int64}
        budget_name: {type: string}
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
          description: Institutional password. May be omitted only in development mode.
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    SessionTokens:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - expires_in
        - refresh_token_expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          minimum: 0
        refresh_token_expires_in:
          type: integer
          minimum: 0
    RefreshResponse:
      $ref: '#/components/schemas/SessionTokens'
    AccountSession:
      type: object
      additionalProperties: false
      required:
        - id
        - user_agent
        - created_at
        - last_used_at
        - expires_at
        - current
      properties:
        id:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
        user_agent:
          type: string
          description: Unverified client-supplied User-Agent at login, limited to 512 UTF-8 bytes with control characters removed. Empty for sessions created before device tracking or without a User-Agent. Treat as plain text when displaying it.
        created_at:
          type: integer
          format: int64
          description: Session creation time as Unix seconds in UTC, preserved across refreshes.
        last_used_at:
          type: integer
          format: int64
          description: Last token issuance or refresh as Unix seconds in UTC. API reads do not update this value.
        expires_at:
          type: integer
          format: int64
          description: Unix seconds when both access and refresh tokens have expired. Zero means no expiration for a legacy non-expiring refresh token. A successful refresh may extend this value.
        current:
          type: boolean
          description: Whether this is the session authenticating the current request.
    AccountSessions:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AccountSession'
        next_cursor:
          type: string
          maxLength: 128
          description: Opaque cursor for the next page; absent on the last page.
    Account:
      type: object
      additionalProperties: false
      required:
        - email
        - created_at
      properties:
        email:
          type: string
          format: email
        created_at:
          type: integer
          description: Account creation timestamp.
    Error:
      type: object
      description: Generic JSON error payload.
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Localized human-readable error message.
